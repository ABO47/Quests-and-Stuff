    <!-- PLAYER 1 -->
    <circle cx="210" cy="215" r="16" fill="#53A6E8"/>
    <rect x="194" y="237" width="32" height="40" rx="10" fill="#53A6E8"/>

    <rect x="180" y="300" width="56" height="22" rx="8" fill="#4B6A84"/>
