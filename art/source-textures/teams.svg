    <!-- Layers -->
    <rect x="150" y="112" width="240" height="320" rx="28" fill="#111820" opacity="0.78"/>
    <rect x="142" y="104" width="240" height="320" rx="28" fill="#2C4050"/>
    <rect x="136" y="96" width="240" height="320" rx="28" fill="#4B6A84"/>
    <rect x="148" y="108" width="216" height="296" rx="20" fill="#22313D"/>

    <!-- Screen -->
