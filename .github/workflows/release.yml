name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release. Leave blank to use mod_version from gradle.properties."
        required: false
        default: ""
      tag:
        description: "Git tag to create or update. Leave blank to use v<version>."
        required: false
        default: ""
      draft:
        description: "Create the GitHub release as a draft."
        required: true
        type: boolean
        default: true
      prerelease:
        description: "Mark the GitHub release as a prerelease."
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build and release Forge + Fabric
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^mod_version=//p' gradle.properties | tail -n 1)"
          fi
          if [ -z "$version" ]; then
            echo "Could not resolve release version." >&2
            exit 1
          fi

          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="v${version}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_name=Quests and Stuff ${version}" >> "$GITHUB_OUTPUT"

      - name: Build both loaders
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :questsandstuff-common:test \
            :questsandstuff-forge:build \
            :questsandstuff-fabric:build \
            -Pmod_version="$RELEASE_VERSION"

      - name: Stage release jars
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p release
          forge_jar="forge/build/libs/questsandstuff-forge-${RELEASE_VERSION}.jar"
          fabric_jar="fabric/build/libs/questsandstuff-fabric-${RELEASE_VERSION}.jar"

          for jar in "$forge_jar" "$fabric_jar"; do
            if [ ! -f "$jar" ]; then
              echo "Expected release jar not found: $jar" >&2
              echo "Available jars:" >&2
              find forge/build/libs fabric/build/libs -maxdepth 1 -type f -name "*.jar" -print >&2
              exit 1
            fi
            cp "$jar" release/
          done

          ls -lh release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: questsandstuff-${{ steps.meta.outputs.version }}-both-loaders
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            release/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
